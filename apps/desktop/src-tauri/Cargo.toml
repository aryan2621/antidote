[package]
name = "antidote-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "antidote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
antidote-core = { path = "../../../crates/core" }
anyhow = "1"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
