[package]
name = "antidote-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "HTTP API for the Antidote feed: package checks, badges and opt-in rule-hit stats"

[dependencies]
antidote-core = { path = "../core" }
anyhow = "1"
axum = "0.8.9"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
