[package]
name = "antidote-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "antidote_core"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
include_dir = "0.7"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
walkdir = "2"
yara-x = "1"

[dev-dependencies]
minisign = "0.10"
