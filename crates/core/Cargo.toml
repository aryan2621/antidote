[package]
name = "antidote-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "antidote_core"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
include_dir = "0.7"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
ureq = "3"
walkdir = "2"
yara-x = "1"
