# Install + start a flagged npm/PyPI package in a gVisor sandbox with a sinkholing proxy.
# Off by default for crawler findings (repo variable ANTIDOTE_AUTO_DETONATE); `/detonate` or adding
# the `detonate` label runs it for one issue. Move to a dedicated KVM host before running at volume.
name: detonate
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue: { description: Triage issue number, required: true }
concurrency: { group: "detonate-${{ github.event.issue.number || inputs.issue }}" }
jobs:
  detonate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'detonate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      stem: ${{ steps.spec.outputs.stem }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p antidote-ops
      - id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          spec=$(printf '%s' "$title" | sed -nE 's/^\[triage\] (npm|PyPI):(.+)@([^@ ]+) \(.*$/\1 \2 \3/p')
          [ -n "$spec" ] || { echo "::error::issue is not an npm/PyPI triage issue"; exit 1; }
          read -r eco name ver <<<"$spec"
          stem=$(printf '%s' "$eco:$name" | tr -c 'A-Za-z0-9@._-' '_')
          { echo "eco=$eco"; echo "name=$name"; echo "ver=$ver"; echo "stem=$stem"; echo "issue=$ISSUE"; } >> "$GITHUB_OUTPUT"
      - name: Detonate
        env:
          ECO: ${{ steps.spec.outputs.eco }}
          NAME: ${{ steps.spec.outputs.name }}
          VER: ${{ steps.spec.outputs.ver }}
          STEM: ${{ steps.spec.outputs.stem }}
        run: |
          git fetch -q origin crawl-state || true
          export ANTIDOTE_PREVIOUS_TOOLS_HASH=$(git show "origin/crawl-state:detonations/$STEM.json" 2>/dev/null | jq -r '.tools_hash // empty')
          export ANTIDOTE_OPS=$PWD/target/release/antidote-ops
          detonate/run.sh "$ECO" "$NAME" "$VER" det
          echo "${{ steps.spec.outputs.issue }}" > det/issue
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: detonation, path: det, retention-days: 30 }
  report:
    needs: detonate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: crawl-state }
      - uses: actions/download-artifact@v4
        with: { name: detonation, path: det }
      - env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ needs.detonate.outputs.stem }}
        run: |
          gh issue comment "$(cat det/issue)" --body-file det/comment.md
          mkdir -p detonations && cp det/report.json "detonations/$STEM.json"
          git add detonations
          git -c user.name=antidote-bot -c user.email=antidote-bot@users.noreply.github.com commit -qm "detonation $STEM" || exit 0
          git push -q origin HEAD:crawl-state
