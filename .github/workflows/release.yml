name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          ANTIDOTE_FEED_PUBKEY: ${{ vars.ANTIDOTE_FEED_PUBKEY }}
        run: |
          export ANTIDOTE_CORPUS_VERSION=$(git log -1 --format=%ct -- corpus)
          cargo build --release --locked -p antidote --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          bin=antidote; [ -f antidote.exe ] && bin=antidote.exe
          tar czf ../../../antidote-${{ matrix.target }}.tar.gz $bin
          cd ../../..
          f=antidote-${{ matrix.target }}.tar.gz
          (command -v sha256sum >/dev/null && sha256sum $f || shasum -a 256 $f) | cut -d' ' -f1 > $f.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            antidote-${{ matrix.target }}.tar.gz
            antidote-${{ matrix.target }}.tar.gz.sha256
