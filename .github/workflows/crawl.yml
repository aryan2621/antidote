# Hourly: crawl registries, analyze new versions, open triage issues, persist state on `crawl-state`.
name: crawl
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write   # to dispatch detonations
concurrency: { group: crawl, cancel-in-progress: false }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check out crawl state
        run: |
          if git fetch -q origin crawl-state:crawl-state; then git worktree add -q state crawl-state
          else git worktree add -q --orphan -b crawl-state state; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p antidote-ops
      - name: Crawl and analyze
        run: ./target/release/antidote-ops run --state state/state.json --out out --allowlist corpus/allowlist.json
      - name: Open triage issues
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_DETONATE: ${{ vars.ANTIDOTE_AUTO_DETONATE }}
        run: |
          gh label create triage --color FBCA04 2>/dev/null || true
          for f in out/issues/*.md; do
            [ -e "$f" ] || continue
            title=$(head -1 "$f"); key=${title% (*}
            n=$(gh issue list --state all --search "\"${key#\[triage\] }\" in:title" --json number --jq length)
            [ "$n" = 0 ] || continue
            sev=${title##*\(}; sev=${sev%)}
            gh label create "sev:$sev" 2>/dev/null || true
            url=$(tail -n +2 "$f" | gh issue create --title "$title" --body-file - --label triage --label "sev:$sev")
            case "$AUTO_DETONATE:$sev:$key" in
              true:critical:*npm:*|true:high:*npm:*|true:critical:*PyPI:*|true:high:*PyPI:*)
                gh workflow run detonate.yml -f issue="${url##*/}" ;;
            esac
          done
      - name: Save state
        run: |
          mkdir -p state/reports
          cp -r out/reports/. state/reports/ 2>/dev/null || true
          cd state
          git add -A
          git -c user.name=antidote-bot -c user.email=antidote-bot@users.noreply.github.com commit -qm "crawl $(date -u +%FT%TZ)" || exit 0
          git push -q origin crawl-state
